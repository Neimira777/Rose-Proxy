<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Content-Security-Policy" content="default-src * 'unsafe-inline' 'unsafe-eval' blob: data:;">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Neimira — Rose</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1A237E;
      --cyan: #00BCD4;
      --blue: #2979FF;
      --bg: #0a0e1a;
      --surface: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.1);
      --text: rgba(255,255,255,0.92);
      --text-muted: rgba(255,255,255,0.45);
      --green: #1DB954;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
    }

    .ambient {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    .ambient::before {
      content: '';
      position: absolute;
      top: -20%;
      left: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(0,188,212,0.08) 0%, transparent 70%);
      animation: drift1 12s ease-in-out infinite alternate;
    }
    .ambient::after {
      content: '';
      position: absolute;
      bottom: -20%;
      right: -10%;
      width: 60%;
      height: 60%;
      background: radial-gradient(ellipse, rgba(41,121,255,0.08) 0%, transparent 70%);
      animation: drift2 15s ease-in-out infinite alternate;
    }
    @keyframes drift1 { from { transform: translate(0,0); } to { transform: translate(3%,5%); } }
    @keyframes drift2 { from { transform: translate(0,0); } to { transform: translate(-3%,-5%); } }

    .screen {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .screen.hidden {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
    }

    #selectionScreen {
      padding: 40px 24px;
      gap: 0;
    }

    .logo {
      text-align: center;
      margin-bottom: 48px;
    }
    .logo-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 42px;
      font-weight: 300;
      letter-spacing: 14px;
      text-transform: uppercase;
      color: white;
    }
    .logo-tag {
      font-size: 10px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-top: 6px;
      font-weight: 400;
    }

    .selection-panel {
      width: 100%;
      max-width: 480px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(20px);
      margin-bottom: 16px;
    }
    .panel-title {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 20px;
      font-weight: 500;
    }

    .patient-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 240px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .patient-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 20px;
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      font-weight: 400;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: left;
    }
    .patient-btn:hover {
      background: rgba(0,188,212,0.12);
      border-color: var(--cyan);
      color: white;
    }

    .divider {
      text-align: center;
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 3px;
      margin: 12px 0;
    }

    .home-btn {
      width: 100%;
      max-width: 480px;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      border: none;
      border-radius: 18px;
      padding: 20px;
      color: white;
      font-family: 'Jost', sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0,188,212,0.25);
    }
    .home-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0,188,212,0.35);
    }

    .load-link {
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 1px;
      cursor: pointer;
      text-align: center;
      margin-bottom: 20px;
      transition: color 0.2s;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    .load-link:hover { color: var(--cyan); }

    #roseScreen { background: #000; }

    #roseVideo {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    .vignette {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.5) 100%),
        linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, transparent 30%, transparent 70%, rgba(0,0,0,0.6) 100%);
      z-index: 1;
      pointer-events: none;
    }

    .rose-topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }
    .rose-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
    }
    .end-btn {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 8px 20px;
      color: rgba(255,255,255,0.7);
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      backdrop-filter: blur(10px);
    }
    .end-btn:hover {
      background: rgba(255,255,255,0.18);
      color: white;
    }

    .listen-indicator {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .listen-indicator.active { opacity: 1; }
    .listen-rings {
      position: relative;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .listen-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--cyan);
      animation: pulse-ring 1.8s ease-out infinite;
    }
    .listen-ring:nth-child(1) { width: 60px; height: 60px; animation-delay: 0s; }
    .listen-ring:nth-child(2) { width: 60px; height: 60px; animation-delay: 0.6s; }
    .listen-ring:nth-child(3) { width: 60px; height: 60px; animation-delay: 1.2s; }
    @keyframes pulse-ring {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
    .mic-icon {
      width: 28px;
      height: 28px;
      background: var(--cyan);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 1;
    }
    .listen-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyan);
    }

    .speaking-indicator {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .speaking-indicator.active { opacity: 1; }
    .sound-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 30px;
    }
    .sound-bar {
      width: 4px;
      background: var(--cyan);
      border-radius: 2px;
      animation: sound-wave 0.8s ease-in-out infinite alternate;
    }
    .sound-bar:nth-child(1) { height: 8px; animation-delay: 0s; }
    .sound-bar:nth-child(2) { height: 20px; animation-delay: 0.15s; }
    .sound-bar:nth-child(3) { height: 30px; animation-delay: 0.3s; }
    .sound-bar:nth-child(4) { height: 20px; animation-delay: 0.45s; }
    .sound-bar:nth-child(5) { height: 8px; animation-delay: 0.6s; }
    @keyframes sound-wave {
      from { transform: scaleY(0.4); opacity: 0.6; }
      to { transform: scaleY(1); opacity: 1; }
    }
    .speaking-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--cyan);
    }

    #musicBar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(29,185,84,0.3);
      padding: 14px 32px;
      z-index: 20;
      transform: translateY(100%);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 16px;
    }
    #musicBar.visible { transform: translateY(0); }
    .music-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--green), #158a3a);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .music-info { flex: 1; min-width: 0; }
    .music-label {
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 3px;
    }
    #nowPlayingText {
      font-size: 14px;
      color: white;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .music-controls { display: flex; gap: 8px; flex-shrink: 0; }
    .music-ctrl {
      background: rgba(255,255,255,0.08);
      border: none;
      border-radius: 8px;
      width: 34px;
      height: 34px;
      color: white;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .music-ctrl:hover { background: rgba(255,255,255,0.15); }
    .music-ctrl.play {
      background: var(--green);
      width: 40px;
      height: 40px;
      border-radius: 10px;
    }
    .music-ctrl.play:hover { background: #22c55e; }

    [data-name="did-agent"] {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      z-index: 2 !important;
    }

    .loading-text {
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="ambient"></div>

  <!-- ── SELECTION SCREEN ── -->
  <div class="screen" id="selectionScreen">
    <div class="logo">
      <div class="logo-name">Neimira</div>
      <div class="logo-tag">AI Companion Technology</div>
    </div>

    <div class="selection-panel">
      <div class="panel-title">Facility — Select Patient</div>
      <div class="patient-list" id="patientList">
        <div class="loading-text">—</div>
      </div>
    </div>

    <div class="load-link" id="loadLink" onclick="loadPatients()">Load facility patients</div>

    <div class="divider">— or —</div>

    <button class="home-btn" onclick="launchCompanion('recMLLC4fJHBUhE5w')">
      Visit with Rose 🌹
    </button>
  </div>

  <!-- ── ROSE SCREEN ── -->
  <div class="screen hidden" id="roseScreen">
    <video id="roseVideo" autoplay playsinline muted></video>
    <div class="vignette"></div>

    <div class="rose-topbar">
      <div class="rose-logo">Neimira</div>
      <button class="end-btn" onclick="endSession()">End Visit</button>
    </div>

    <div class="listen-indicator" id="listenIndicator">
      <div class="listen-rings">
        <div class="listen-ring"></div>
        <div class="listen-ring"></div>
        <div class="listen-ring"></div>
        <div class="mic-icon">🎤</div>
      </div>
      <div class="listen-label">Listening</div>
    </div>

    <div class="speaking-indicator" id="speakingIndicator">
      <div class="sound-bars">
        <div class="sound-bar"></div>
        <div class="sound-bar"></div>
        <div class="sound-bar"></div>
        <div class="sound-bar"></div>
        <div class="sound-bar"></div>
      </div>
      <div class="speaking-label">Rose is speaking</div>
    </div>

    <div id="musicBar">
      <div class="music-icon">♪</div>
      <div class="music-info">
        <div class="music-label">Now Playing</div>
        <div id="nowPlayingText">—</div>
      </div>
      <div class="music-controls">
        <button class="music-ctrl" onclick="spotifyPrevious()">⏮</button>
        <button class="music-ctrl play" id="playPauseBtn" onclick="spotifyPlayPause()">⏸</button>
        <button class="music-ctrl" onclick="spotifyNext()">⏭</button>
      </div>
    </div>
  </div>

  <!-- ── Rose's agent — hardcoded, always loads Rose ── -->
  <script>
    document.write('<scr' + 'ipt type="module" ' +
      'src="https://agent.d-id.com/v2/index.js" ' +
      'data-mode="fabio" ' +
      'data-client-key="ck_-MqtRhwe5B0Gqmpm3oow5" ' +
      'data-agent-id="v2_agt_LZBI4lcW" ' +
      'data-name="did-agent" ' +
      'data-monitor="true" ' +
      'data-orientation="horizontal" ' +
      'data-position="right" ' +
      'data-open-mode="expanded"><\/scr' + 'ipt>');
  </script>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>

  <script>
    const _urlParams = new URLSearchParams(window.location.search);
    let currentPatientId = _urlParams.get('patient') || null;

    let spotifyPlayer = null;
    let spotifyDeviceId = null;
    let isPlaying = false;
    let musicPollInterval = null;
    let recognition = null;
    let isListening = false;
    let isSpeaking = false;
    let conversationHistory = [];

    window.speechSynthesis?.cancel();

    window.onSpotifyWebPlaybackSDKReady = () => {
      console.log('Spotify SDK ready');
    };

    function showRoseScreen() {
      document.getElementById('selectionScreen').classList.add('hidden');
      document.getElementById('roseScreen').classList.remove('hidden');
    }

    function showSelectionScreen() {
      document.getElementById('roseScreen').classList.add('hidden');
      document.getElementById('selectionScreen').classList.remove('hidden');
    }

    async function initSpotify(patientId) {
      try {
        const res = await fetch('https://rose-proxy.vercel.app/api/spotify-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ patientId })
        });
        const data = await res.json();
        if (!data.access_token) { console.log('No Spotify token'); return; }

        spotifyPlayer = new Spotify.Player({
          name: 'Neimira — Companion',
          getOAuthToken: cb => cb(data.access_token),
          volume: 0.35
        });

        spotifyPlayer.addListener('ready', ({ device_id }) => {
          spotifyDeviceId = device_id;
        });

        spotifyPlayer.addListener('player_state_changed', state => {
          if (!state) return;
          isPlaying = !state.paused;
          const track = state.track_window?.current_track;
          if (track) {
            document.getElementById('nowPlayingText').textContent =
              track.name + ' — ' + track.artists.map(a => a.name).join(', ');
            document.getElementById('musicBar').classList.add('visible');
          }
          document.getElementById('playPauseBtn').textContent = isPlaying ? '⏸' : '▶';
        });

        spotifyPlayer.connect();
      } catch (e) {
        console.error('Spotify init error:', e);
      }
    }

    function duckMusic() { if (spotifyPlayer) spotifyPlayer.setVolume(0.1); }
    function restoreMusic() { if (spotifyPlayer) spotifyPlayer.setVolume(0.35); }

    async function spotifyPlayBySearch(query) {
      try {
        const tokenRes = await fetch('https://rose-proxy.vercel.app/api/spotify-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ patientId: currentPatientId })
        });
        const tokenData = await tokenRes.json();
        const access_token = tokenData.access_token;
        if (!access_token) return;

        let uri = null;

        const artistRes = await fetch(
          'https://api.spotify.com/v1/search?q=' + encodeURIComponent(query) + '&type=artist&limit=1',
          { headers: { 'Authorization': 'Bearer ' + access_token } }
        );
        const artistData = await artistRes.json();
        const artist = artistData.artists?.items?.[0];

        if (artist) {
          const topTracksRes = await fetch(
            'https://api.spotify.com/v1/artists/' + artist.id + '/top-tracks?market=US',
            { headers: { 'Authorization': 'Bearer ' + access_token } }
          );
          const topTracksData = await topTracksRes.json();
          const tracks = topTracksData.tracks || [];
          if (tracks.length > 0) {
            const randomTrack = tracks[Math.floor(Math.random() * Math.min(tracks.length, 10))];
            uri = randomTrack.uri;
          }
        }

        if (!uri) {
          const searchRes = await fetch(
            'https://api.spotify.com/v1/search?q=' + encodeURIComponent(query) + '&type=track&limit=5',
            { headers: { 'Authorization': 'Bearer ' + access_token } }
          );
          const searchData = await searchRes.json();
          const tracks = searchData.tracks?.items || [];
          if (tracks.length === 0) return;
          const randomTrack = tracks[Math.floor(Math.random() * tracks.length)];
          uri = randomTrack.uri;
        }

        await fetch('https://api.spotify.com/v1/me/player/play?device_id=' + spotifyDeviceId, {
          method: 'PUT',
          headers: { 'Authorization': 'Bearer ' + access_token, 'Content-Type': 'application/json' },
          body: JSON.stringify({ uris: [uri] })
        });
      } catch (e) {
        console.error('Spotify play error:', e);
      }
    }

    function startMusicQueuePolling(patientId) {
      if (musicPollInterval) clearInterval(musicPollInterval);
      musicPollInterval = setInterval(async () => {
        try {
          const res = await fetch('https://rose-proxy.vercel.app/api/music-queue?patientId=' + patientId);
          const data = await res.json();
          if (data.query) spotifyPlayBySearch(data.query);
        } catch (e) {}
      }, 2000);
    }

    function spotifyPlayPause() { if (spotifyPlayer) spotifyPlayer.togglePlay(); }
    function spotifyNext() { if (spotifyPlayer) spotifyPlayer.nextTrack(); }
    function spotifyPrevious() { if (spotifyPlayer) spotifyPlayer.previousTrack(); }

    async function sendToRose(userText) {
      try {
        conversationHistory.push({ role: 'user', content: userText });
        const res = await fetch('https://rose-proxy.vercel.app/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ patientId: currentPatientId, messages: conversationHistory })
        });
        const data = await res.json();
        const reply = data.content || '';
        const spokenReply = reply.replace(/PLAY_MUSIC:[^\n]+/g, '').trim();
        conversationHistory.push({ role: 'assistant', content: reply });
        return spokenReply;
      } catch (e) {
        console.error('Chat error:', e);
        return '';
      }
    }

    function setRoseSpeaking(speaking) {
      isSpeaking = speaking;
      document.getElementById('speakingIndicator').classList.toggle('active', speaking);
      document.getElementById('listenIndicator').classList.toggle('active', !speaking);
    }

    function setListening(listening) {
      isListening = listening;
      document.getElementById('listenIndicator').classList.toggle('active', listening && !isSpeaking);
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return;

      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = () => setListening(true);
      recognition.onresult = async (event) => {
        const transcript = event.results[0][0].transcript;
        setListening(false);
        await sendToRose(transcript);
      };
      recognition.onerror = (e) => {
        setListening(false);
        if (e.error !== 'no-speech') setTimeout(() => startListening(), 1000);
      };
      recognition.onend = () => setListening(false);
    }

    function startListening() {
      if (!recognition || isSpeaking) return;
      try { recognition.start(); } catch (e) {}
    }

    async function autoGreet() {
      await sendToRose('Hello');
    }

    async function loadPatients() {
      document.getElementById('loadLink').style.display = 'none';
      const list = document.getElementById('patientList');
      list.innerHTML = '<div class="loading-text">Loading...</div>';
      try {
        const res = await fetch('https://rose-proxy.vercel.app/api/patients');
        const data = await res.json();
        list.innerHTML = '';
        data.patients.forEach(patient => {
          const btn = document.createElement('button');
          btn.className = 'patient-btn';
          btn.textContent = patient.name;
          btn.onclick = () => launchCompanion(patient.id, patient.gender);
          list.appendChild(btn);
        });
      } catch (e) {
        list.innerHTML = '<div class="loading-text">Error loading patients.</div>';
      }
    }

    // ── ROUTING: check gender, send male patients to Jim ──
    async function launchCompanion(patientId, gender) {
      // If gender not passed, fetch from Airtable
      if (!gender) {
        try {
          const res = await fetch('https://rose-proxy.vercel.app/api/patients?id=' + patientId);
          const data = await res.json();
          gender = data.gender || 'Female';
        } catch(e) {
          gender = 'Female';
        }
      }

      const isMale = gender && gender.toLowerCase().trim() === 'male';
      if (isMale) {
        // Redirect to Jim's page
        window.location.href = 'launch-jim.html?patient=' + patientId;
        return;
      }

      // Female — launch Rose on this page
      currentPatientId = patientId;
      conversationHistory = [];
      showRoseScreen();
      await initSpotify(patientId);
      startMusicQueuePolling(patientId);
      setupSpeechRecognition();
      setTimeout(() => autoGreet(), 1500);
    }

    function endSession() {
      if (recognition) recognition.stop();
      if (musicPollInterval) clearInterval(musicPollInterval);
      speechSynthesis.cancel();
      showSelectionScreen();
    }
  </script>

</body>
